# ============================================================================
# Azure DevOps Pipeline - Admin App Multi-Environment Deployment
# ============================================================================
# This pipeline:
# 1. Builds Docker image with environment-specific build args
# 2. Pushes to ACR
# 3. Deploys to Azure App Service (Dev or Prod based on branch)
#
# Branch routing:
# - main        -> Dev environment (auto deploy)
# - release/*   -> Prod environment (requires approval)
# ============================================================================

trigger:
  branches:
    include:
      - main        # -> Dev environment
      - release/*   # -> Prod environment
      - feature/*
      - hotfix/*

pr:
  branches:
    include:
      - main

variables:
  # Common variables
  - name: dockerfilePath
    value: "$(Build.SourcesDirectory)/Dockerfile"
  - name: tag
    value: "$(Build.BuildId)"

  # Environment-specific agent pools
  - name: DEV_AGENT_POOL
    value: 'StaticAgentPool'
  - name: PROD_AGENT_POOL
    value: 'StaticAgentPool-prod'

  # ==========================================================================
  # Environment-specific URLs (defined in pipeline, not variable groups)
  # ==========================================================================
  # API Base URLs (Admin API)
  - name: DEV_API_BASE_URL
    value: 'https://devapi.copilotgtm.com/admin'
  - name: PROD_API_BASE_URL
    value: 'https://api.copilotgtm.com/admin'

stages:
  # ==========================================================================
  # Stage 1a: Build & Push Docker Image (Dev)
  # ==========================================================================
  - stage: BuildAndPushDev
    displayName: "Build & Push Docker Image (Dev)"
    condition: not(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
    variables:
      - group: app-secrets-dev
      - name: API_BASE_URL
        value: 'https://devapi.copilotgtm.com/admin'
    jobs:
      - job: Build
        displayName: "Build and Push to ACR"
        pool:
          name: 'StaticAgentPool'
        steps:
          - checkout: self

          - script: |
              echo "##[group]Build Configuration"
              echo "Branch: $(Build.SourceBranch)"
              echo "Build ID: $(Build.BuildId)"
              echo "Tag: $(tag)"
              echo "##[endgroup]"
              echo ""
              echo "##[group]Environment URLs"
              echo "API_BASE_URL: $(API_BASE_URL)"
              echo "ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)"
              echo "##[endgroup]"
            displayName: "Echo Build Variables"

          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              containerRegistry: "$(ACR_SERVICE_CONNECTION)"
              command: "login"

          - script: |
              docker build \
                --build-arg NEXT_PUBLIC_API_BASE_URL=$(API_BASE_URL) \
                -t $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag) \
                -t $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:latest \
                -f Dockerfile .
            displayName: "Build Docker Image with Build Args"

          - script: |
              docker push $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag)
              docker push $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:latest
            displayName: "Push Docker Image to ACR"

          - script: |
              echo "##[section]Build Complete!"
              echo "Image: $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag)"
              echo "Latest: $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:latest"
            displayName: "Build Summary"

  # ==========================================================================
  # Stage 1b: Build & Push Docker Image (Prod)
  # ==========================================================================
  - stage: BuildAndPushProd
    displayName: "Build & Push Docker Image (Prod)"
    condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')
    variables:
      - group: app-secrets-prod
      - name: API_BASE_URL
        value: 'https://api.copilotgtm.com/admin'
    jobs:
      - job: Build
        displayName: "Build and Push to ACR"
        pool:
          name: 'StaticAgentPool-prod'
        steps:
          - checkout: self

          - script: |
              echo "##[group]Build Configuration"
              echo "Branch: $(Build.SourceBranch)"
              echo "Build ID: $(Build.BuildId)"
              echo "Tag: $(tag)"
              echo "##[endgroup]"
              echo ""
              echo "##[group]Environment URLs"
              echo "API_BASE_URL: $(API_BASE_URL)"
              echo "ACR_LOGIN_SERVER: $(ACR_LOGIN_SERVER)"
              echo "##[endgroup]"
            displayName: "Echo Build Variables"

          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              containerRegistry: "$(ACR_SERVICE_CONNECTION)"
              command: "login"

          - script: |
              docker build \
                --build-arg NEXT_PUBLIC_API_BASE_URL=$(API_BASE_URL) \
                -t $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag) \
                -t $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:latest \
                -f Dockerfile .
            displayName: "Build Docker Image with Build Args"

          - script: |
              docker push $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag)
              docker push $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:latest
            displayName: "Push Docker Image to ACR"

          - script: |
              echo "##[section]Build Complete!"
              echo "Image: $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag)"
              echo "Latest: $(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:latest"
            displayName: "Build Summary"

  # ==========================================================================
  # Stage 2a: Deploy to Dev App Service
  # ==========================================================================
  - stage: DeployDev
    displayName: "Deploy to Dev App Service"
    dependsOn: BuildAndPushDev
    # Deploy to dev for ANY branch except release/* (allows manual runs from feature/*, hotfix/*, etc.)
    condition: and(succeeded(), not(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: app-secrets-dev
      - name: DEPLOY_ENVIRONMENT
        value: 'dev'
    jobs:
      - deployment: DeployWebApp
        displayName: "Deploy to Dev App Service"
        environment: 'dev'
        pool:
          name: $(DEV_AGENT_POOL)
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "##[group]Deploy Configuration"
                    echo "Environment: $(DEPLOY_ENVIRONMENT)"
                    echo "ACR Login Server: $(ACR_LOGIN_SERVER)"
                    echo "Web App Name: $(ADMIN_WEB_APP_NAME)"
                    echo "Resource Group: $(RESOURCE_GROUP)"
                    echo "Image Tag: $(tag)"
                    echo "##[endgroup]"
                  displayName: "Echo Deploy Variables"

                - task: AzureWebAppContainer@1
                  displayName: "Deploy to Azure App Service"
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    appName: $(ADMIN_WEB_APP_NAME)
                    resourceGroupName: $(RESOURCE_GROUP)
                    containers: "$(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag)"

                - script: |
                    echo "##[section]Deployment Complete!"
                    echo "App deployed to: $(WEB_APP_NAME)"
                    echo "Environment: $(DEPLOY_ENVIRONMENT)"
                  displayName: "Deploy Summary"

  # ==========================================================================
  # Stage 2b: Deploy to Prod App Service
  # ==========================================================================
  - stage: DeployProd
    displayName: "Deploy to Prod App Service"
    dependsOn: BuildAndPushProd
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: app-secrets-prod
      - name: DEPLOY_ENVIRONMENT
        value: 'prod'
    jobs:
      - deployment: DeployWebApp
        displayName: "Deploy to Prod App Service"
        environment: 'terraform-prod'  # Requires approval
        pool:
          name: $(PROD_AGENT_POOL)
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "##[group]Deploy Configuration"
                    echo "Environment: $(DEPLOY_ENVIRONMENT)"
                    echo "ACR Login Server: $(ACR_LOGIN_SERVER)"
                    echo "Web App Name: $(ADMIN_WEB_APP_NAME)"
                    echo "Resource Group: $(RESOURCE_GROUP)"
                    echo "Image Tag: $(tag)"
                    echo "##[endgroup]"
                  displayName: "Echo Deploy Variables"

                - task: AzureWebAppContainer@1
                  displayName: "Deploy to Azure App Service"
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    appName: $(ADMIN_WEB_APP_NAME)
                    resourceGroupName: $(RESOURCE_GROUP)
                    containers: "$(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag)"

                - script: |
                    echo "##[section]Deployment Complete!"
                    echo "App deployed to: $(WEB_APP_NAME)"
                    echo "Environment: $(DEPLOY_ENVIRONMENT)"
                  displayName: "Deploy Summary"
