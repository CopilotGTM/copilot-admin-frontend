# Azure DevOps YAML Pipeline – Multi-environment Deployment for Azure App Service

trigger:
  branches:
    include:
      - main
      - dev

pr:
  branches:
    include:
      - main
      - dev

variables:
  # Common variables
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'
  - name: vmImageName
    value: 'ubuntu-latest'
  

stages:
- stage: BuildAndPush
  displayName: 'Build & Push Docker Image to ACR'
  jobs:
  - job: Build
    displayName: 'Build and Push to ACR'
    pool:
      vmImage: $(vmImageName)
    steps:
      - script: |
          echo "dockerfilePath=$(dockerfilePath)"
          echo "tag=$(tag)"
          echo "vmImageName=$(vmImageName)"
          echo "DEPLOY_ENVIRONMENT=$(DEPLOY_ENVIRONMENT)"
          echo "ACR_LOGIN_SERVER=$(ACR_LOGIN_SERVER)"
          echo "ACR_SERVICE_CONNECTION=$(ACR_SERVICE_CONNECTION)"
        displayName: 'Echo Build Variables'
      
      - task: Docker@2
        displayName: 'Build and push image to ACR'
        inputs:
          command: buildAndPush
          containerRegistry: '$(ACR_SERVICE_CONNECTION)'
          repository: 'copilotgtm-frontend-admin-app'
          dockerfile: '**/Dockerfile'
          tags: |
            $(tag)
            latest

- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn: BuildAndPush
  condition: succeeded()
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy to App Service'
    environment: '$(DEPLOY_ENVIRONMENT)'
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              echo "DEPLOY_ENVIRONMENT=$(DEPLOY_ENVIRONMENT)"
              echo "ACR_LOGIN_SERVER=$(ACR_LOGIN_SERVER)"
              echo "ACR_SERVICE_CONNECTION=$(ACR_SERVICE_CONNECTION)"
              echo "AZURE_SUBSCRIPTION=$(AZURE_SUBSCRIPTION)"
              echo "WEB_APP_NAME=$(WEB_APP_NAME)"
              echo "RESOURCE_GROUP=$(RESOURCE_GROUP)"
              echo "Image tag=$(tag)"
            displayName: 'Echo Deploy Variables'
          
          # Method 1: Using AzureWebAppContainer task (keeps your existing approach)
          - task: AzureWebAppContainer@1
            displayName: 'Deploy to Azure App Service via Container Task'
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              appName: $(WEB_APP_NAME)
              resourceGroupName: $(RESOURCE_GROUP)
              containers: '$(ACR_LOGIN_SERVER)/copilotgtm-frontend-admin-app:$(tag)'
          
          # Method 2: Alternative using Azure CLI (more flexible)
          # Uncomment if you prefer this approach over the container task above
          # - task: AzureCLI@2
          #   displayName: 'Update App Service Container Image via CLI'
          #   inputs:
          #     azureSubscription: $(AZURE_SUBSCRIPTION)
