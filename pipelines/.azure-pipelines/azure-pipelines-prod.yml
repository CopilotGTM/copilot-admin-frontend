# ============================================================================
# Azure DevOps Pipeline - Admin App PROD Environment
# ============================================================================
# This pipeline handles PROD deployments only.
# Triggers on: release/* branches
# Stages: SecurityGate -> Build -> Deploy (with approval gate)
# ============================================================================

trigger:
  branches:
    include:
      - release/*

pr: none  # No PR triggers for prod pipeline

# Use prod-specific variable group
variables:
  - group: app-secrets-prod
  - name: ENVIRONMENT
    value: 'prod'
  - name: dockerfilePath
    value: "$(Build.SourcesDirectory)/Dockerfile"
  - name: tag
    value: "$(Build.BuildId)"
  - name: AGENT_POOL
    value: 'StaticAgentPool-prod'
  - name: API_BASE_URL
    value: 'https://api.copilotgtm.com/admin'
  - name: IMAGE_NAME
    value: 'copilotgtm-frontend-admin-app'
  - name: DOCKER_BUILDKIT
    value: '1'

stages:
  # ==========================================================================
  # Stage 1: Security Gate - Security Tests & Dependency Audit
  # ==========================================================================
  - stage: SecurityGate
    displayName: "Security Gate"
    pool:
      name: $(AGENT_POOL)
    jobs:
      - job: SecurityTests
        displayName: "Run Security Tests & Dependency Audit"
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Install Node.js"
            inputs:
              versionSpec: '20.x'

          - script: |
              yarn install --frozen-lockfile --network-timeout 100000
            displayName: "Install Dependencies"

          - script: |
              yarn test:security --ci --forceExit
            displayName: "Run Security Tests"

          - script: |
              echo "##[section]Security Gate Passed!"
            displayName: "Security Gate Summary"

  # ==========================================================================
  # Stage 2: Build & Push Docker Image to Prod ACR (BuildKit + Registry Cache)
  # ==========================================================================
  - stage: Build
    displayName: "Build & Push (Prod)"
    dependsOn: SecurityGate
    pool:
      name: $(AGENT_POOL)
    jobs:
      - job: BuildAndPush
        displayName: "Build and Push to Prod ACR"
        steps:
          - checkout: self

          - script: |
              echo "##[group]Build Configuration"
              echo "Environment: $(ENVIRONMENT)"
              echo "Branch: $(Build.SourceBranch)"
              echo "Build ID: $(Build.BuildId)"
              echo "Tag: $(tag)"
              echo "ACR: $(ACR_LOGIN_SERVER)"
              echo "Image: $(IMAGE_NAME)"
              echo "##[endgroup]"
              echo ""
              echo "##[group]Environment URLs"
              echo "API_BASE_URL: $(API_BASE_URL)"
              echo "##[endgroup]"
            displayName: "Echo Build Variables"

          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              containerRegistry: "$(ACR_SERVICE_CONNECTION)"
              command: "login"

          - script: |
              docker buildx create --use --name pipeline-builder 2>/dev/null || docker buildx use pipeline-builder
              docker buildx build \
                --file "$(dockerfilePath)" \
                --build-arg "NEXT_PUBLIC_API_BASE_URL=$(API_BASE_URL)" \
                --cache-from type=registry,ref=$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):cache \
                --cache-to type=registry,ref=$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):cache,mode=max \
                --tag $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(tag) \
                --tag $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):latest \
                --push \
                "$(Build.SourcesDirectory)"
            displayName: "Build & Push with BuildKit (Registry Cache)"
            env:
              DOCKER_BUILDKIT: 1

          - script: |
              echo "##[section]Build Complete!"
              echo "Image: $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(tag)"
            displayName: "Build Summary"

      - job: ContainerSecurityTests
        displayName: "Container Security Tests"
        dependsOn: BuildAndPush
        steps:
          - checkout: self

          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              containerRegistry: "$(ACR_SERVICE_CONNECTION)"
              command: "login"

          - script: |
              docker pull $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(tag)
              chmod +x scripts/container-security-test.sh
              ./scripts/container-security-test.sh $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(tag)
            displayName: "Run Container Security Tests"

  # ==========================================================================
  # Stage 3: Deploy to Prod App Service (Requires Approval)
  # ==========================================================================
  - stage: Deploy
    displayName: "Deploy (Prod)"
    dependsOn: Build
    condition: succeeded()
    pool:
      name: $(AGENT_POOL)
    jobs:
      - deployment: DeployWebApp
        displayName: "Deploy to Prod App Service"
        environment: 'terraform-prod'  # Uses approval gate configured in Azure DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "##[group]Deploy Configuration"
                    echo "Environment: $(ENVIRONMENT)"
                    echo "Web App: $(ADMIN_WEB_APP_NAME)"
                    echo "Resource Group: $(RESOURCE_GROUP)"
                    echo "Image Tag: $(tag)"
                    echo "##[endgroup]"
                  displayName: "Echo Deploy Variables"

                - task: AzureWebAppContainer@1
                  displayName: "Deploy to Azure App Service"
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    appName: $(ADMIN_WEB_APP_NAME)
                    resourceGroupName: $(RESOURCE_GROUP)
                    containers: "$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(tag)"

                - script: |
                    echo "##[section]Deployment Complete!"
                    echo "App deployed to: $(ADMIN_WEB_APP_NAME)"
                    echo "Environment: $(ENVIRONMENT)"
                  displayName: "Deploy Summary"
