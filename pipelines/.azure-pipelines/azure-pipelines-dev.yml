# ============================================================================
# Azure DevOps Pipeline - Admin App DEV Environment
# ============================================================================
# This pipeline handles DEV deployments only.
# Triggers on: main, feature/*, hotfix/* branches
# Deploys to: Dev Admin App Service
#
# Mirrors the main frontend app pipeline structure while preserving admin image,
# API, and App Service settings.
# ============================================================================

trigger:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*

pr:
  branches:
    include:
      - main

variables:
  - group: app-secrets-dev
  - name: ENVIRONMENT
    value: 'dev'
  - name: dockerfilePath
    value: "$(Build.SourcesDirectory)/Dockerfile"
  - name: tag
    value: "$(Build.BuildId)"
  - name: FAST_AGENT_POOL
    value: 'copilot-devops-dev-fast'
  - name: DEPLOY_AGENT_POOL
    value: 'copilot-devops-dev-deploy'
  - name: ACR_SERVICE_CONNECTION
    value: 'copilotgtm-acr-connection-dev'
  - name: ACR_NAME
    value: 'copilotgtmacrdev'
  - name: IMAGE_NAME
    value: 'copilotgtm-frontend-admin-app'
  - name: DOCKER_BUILDKIT
    value: '1'
  - name: API_BASE_URL
    value: 'https://devapi.copilotgtm.com/admin'
  - name: ADMIN_APP_URL
    value: 'https://devadmin.copilotgtm.com'

stages:
  - stage: SecurityGate
    displayName: "Security Checks"
    pool:
      name: $(FAST_AGENT_POOL)
    jobs:
      - job: SecurityTests
        displayName: "Run Security Tests & Audit"
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: "Install Node.js 20"
            inputs:
              version: '20.x'

          - script: corepack enable
            displayName: "Enable Yarn via Corepack"

          - task: Cache@2
            displayName: "Cache node_modules"
            inputs:
              key: 'node_modules | "$(Agent.OS)" | $(Build.SourcesDirectory)/yarn.lock'
              path: $(Build.SourcesDirectory)/node_modules
              restoreKeys: |
                node_modules | "$(Agent.OS)"

          - script: |
              echo '##[section]Installing dependencies...'
              yarn install --frozen-lockfile --prefer-offline --network-timeout 100000
            displayName: "Install Dependencies"

          - script: |
              echo '##[section]Running dependency audit...'
              yarn audit --groups dependencies --level critical; test $? -lt 16
            displayName: "Dependency Audit"

          - script: |
              echo '##[section]Running security test suite...'
              yarn test:security --ci --forceExit
            displayName: "Security Tests"

  - stage: Build
    displayName: "Build & Push (Dev)"
    dependsOn: SecurityGate
    pool:
      name: $(FAST_AGENT_POOL)
    jobs:
      - job: BuildAndPush
        displayName: "Build and Push to Dev ACR"
        variables:
          - name: ACR_LOGIN_SERVER
            value: $(ACR_NAME).azurecr.io
          - name: FULL_IMAGE_NAME
            value: $(ACR_LOGIN_SERVER)/$(IMAGE_NAME)
        steps:
          - checkout: self

          - script: |
              echo "##[group]Build Configuration"
              echo "Environment: $(ENVIRONMENT)"
              echo "Branch: $(Build.SourceBranch)"
              echo "Build ID: $(Build.BuildId)"
              echo "Tag: $(tag)"
              echo "ACR: $(ACR_LOGIN_SERVER)"
              echo "Image: $(IMAGE_NAME)"
              echo "BuildKit: $(DOCKER_BUILDKIT)"
              echo "API_BASE_URL: $(API_BASE_URL)"
              echo "##[endgroup]"
            displayName: "Echo Build Variables"

          - task: Docker@2
            displayName: "Login to ACR"
            inputs:
              command: login
              containerRegistry: $(ACR_SERVICE_CONNECTION)

          - script: |
              docker buildx create --name cibuilder --use --bootstrap 2>/dev/null || docker buildx use cibuilder
              docker buildx inspect --bootstrap
            displayName: "Setup Buildx Builder"

          - script: |
              echo "Building image locally for security scanning..."
              docker buildx build \
                --cache-from type=registry,ref=$(FULL_IMAGE_NAME):cache \
                --build-arg "NEXT_PUBLIC_API_BASE_URL=$(API_BASE_URL)" \
                --build-arg "NEXT_PUBLIC_ADMIN_APP_URL=$(ADMIN_APP_URL)" \
                --build-arg "NEXT_PUBLIC_BUILD_SHA=$(Build.SourceVersion)" \
                -t $(FULL_IMAGE_NAME):$(tag) \
                -t $(FULL_IMAGE_NAME):latest \
                --load \
                -f $(dockerfilePath) \
                $(Build.SourcesDirectory)
            displayName: "Build Docker Image"
            env:
              DOCKER_BUILDKIT: 1

          - script: |
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image \
                --severity CRITICAL,HIGH \
                --exit-code 1 \
                --no-progress \
                --ignore-unfixed \
                $(FULL_IMAGE_NAME):$(tag)
            displayName: "Trivy Vulnerability Scan"

          - script: |
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "$(Build.ArtifactStagingDirectory):/output" \
                aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c image \
                --format cyclonedx \
                --output /output/sbom.json \
                $(FULL_IMAGE_NAME):$(tag)
              echo "SBOM generated at $(Build.ArtifactStagingDirectory)/sbom.json"
            displayName: "Generate SBOM"

          - task: PublishBuildArtifacts@1
            displayName: "Publish SBOM"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)/sbom.json"
              ArtifactName: "sbom"

          - script: |
              chmod +x $(Build.SourcesDirectory)/scripts/container-security-test.sh
              $(Build.SourcesDirectory)/scripts/container-security-test.sh $(FULL_IMAGE_NAME):$(tag)
            displayName: "Container Security Tests"

          - script: |
              echo "All security checks passed. Pushing scanned image to ACR..."
              docker push $(FULL_IMAGE_NAME):$(tag)
              docker push $(FULL_IMAGE_NAME):latest
            displayName: "Push Docker Image to ACR"

          - script: |
              docker buildx build \
                --progress=plain \
                --cache-from type=registry,ref=$(FULL_IMAGE_NAME):cache \
                --cache-to type=registry,ref=$(FULL_IMAGE_NAME):cache,mode=min \
                --build-arg "NEXT_PUBLIC_API_BASE_URL=$(API_BASE_URL)" \
                --build-arg "NEXT_PUBLIC_ADMIN_APP_URL=$(ADMIN_APP_URL)" \
                --build-arg "NEXT_PUBLIC_BUILD_SHA=$(Build.SourceVersion)" \
                -f $(dockerfilePath) \
                $(Build.SourcesDirectory) || echo "##[warning]Registry cache update failed; continuing because the scanned image was already pushed."
            displayName: "Update Registry Cache"
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            env:
              DOCKER_BUILDKIT: 1

          - script: |
              echo "##[section]Build Complete!"
              echo "Image: $(FULL_IMAGE_NAME):$(tag)"
              echo "Cache: $(FULL_IMAGE_NAME):cache"
            displayName: "Build Summary"

  - stage: Deploy
    displayName: "Deploy (Dev)"
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    pool:
      name: $(DEPLOY_AGENT_POOL)
    variables:
      - name: ACR_LOGIN_SERVER
        value: $(ACR_NAME).azurecr.io
    jobs:
      - deployment: DeployWebApp
        displayName: "Deploy to Dev Admin App Service"
        environment: 'dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "##[group]Deploy Configuration"
                    echo "Environment: $(ENVIRONMENT)"
                    echo "Web App: $(ADMIN_WEB_APP_NAME)"
                    echo "Resource Group: $(RESOURCE_GROUP)"
                    echo "Image Tag: $(tag)"
                    echo "##[endgroup]"
                  displayName: "Echo Deploy Variables"

                - task: AzureWebAppContainer@1
                  displayName: "Deploy to Azure App Service"
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    appName: $(ADMIN_WEB_APP_NAME)
                    resourceGroupName: $(RESOURCE_GROUP)
                    containers: "$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(tag)"

                - script: |
                    echo "##[section]Deployment Complete!"
                    echo "App deployed to: $(ADMIN_WEB_APP_NAME)"
                    echo "Environment: $(ENVIRONMENT)"
                  displayName: "Deploy Summary"
